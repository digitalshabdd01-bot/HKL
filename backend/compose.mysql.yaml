# Local MySQL only. This does not create a Render service.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: hkl
      MYSQL_USER: hkl_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD privately}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD privately}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - hkl_mysql_data:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  hkl_mysql_data:
