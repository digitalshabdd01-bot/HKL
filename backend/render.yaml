# Deploy this separately from the existing frontend; select backend/render.yaml.
services:
  - type: web
    name: hkl-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
