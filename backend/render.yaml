# Deploy this separately from the existing frontend; select backend/render.yaml.
services:
  - type: web
    name: hkl-backend
    runtime: python
    plan: free
    # Keep repository content/ available to the import commands.
    buildCommand: bash backend/build.sh
    startCommand: gunicorn --chdir backend config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    buildFilter:
      paths:
        - backend/**
        - content/**
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: FRONTEND_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
